[package]
name = "lh-contributor-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "LandHunter contributor client SDK: lease chunks from the lh-tracker coordinator, execute them, stage blobs to R2, submit results."
license = "MIT"

[lib]
name = "lh_contributor_client"
path = "src/lib.rs"

[[bin]]
name = "lh-contributor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
