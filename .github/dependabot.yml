version: 2
updates:
  # glib is a transitive dependency of Tauri's Linux GTK stack — the version is
  # pinned by the Tauri crate, not by us. RUSTSEC-2024-0429 was triaged not-used
  # (static audit 2026-11-18, Dependabot alert #2 dismissed). Bumping glib
  # directly breaks the Tauri build; we take the fix when Tauri upgrades.
  - package-ecosystem: cargo
    directory: "/gui/src-tauri"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "glib"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
