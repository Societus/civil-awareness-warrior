# Release pipeline for the Civil Awareness Warrior GUI (card t_f9279e25;
# rebrand t_417bde85).
#
# Trigger: a tag push matching v* (or a manual dispatch — see README
# "Releasing" for what each does). One build per OS on GitHub-hosted
# runners; all artifacts are attached to a GitHub Release named after the
# tag. Nothing is signed/notarized here — that is a deliberate later
# operator step (README documents how to bolt it on).
#
# Layout: this is the lh-contributor MONOREPO. The GUI lives at gui/
# and the SDK at sdk/; src-tauri/Cargo.toml embeds the SDK as a PATH
# dependency at ../../sdk, which a single checkout satisfies — no
# sibling-repo checkout or token needed.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish the GitHub Release marked as a prerelease
        type: boolean
        default: true
      tag_name:
        description: Tag to publish against (dispatch only; defaults to the pushed tag ref)
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Guard: fail fast (19s, no runners burned) when the publish target and
  # the version surfaces disagree. v0.1.1 shipped 0.1.0-labeled binaries and
  # a v0.1.3 tag was cut from 0.1.2-labeled sources — this job makes both
  # impossible. RT2 F5 extended it to workflow_dispatch (a dispatch used to
  # skip the guard entirely, and the publish step would create a release
  # named after a branch or any typed string); RT2 F1 adds the pin check so
  # a release can never ship the placeholder contract key.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the tag this run publishes under
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Dispatch: the publish step uses inputs.tag_name verbatim, so
            # that value — not REF_NAME (a branch) — is what must be guarded.
            if [ -z "$DISPATCH_TAG" ]; then
              echo "::error::workflow_dispatch requires the tag_name input (vMAJOR.MINOR.PATCH, matching tauri.conf.json)"
              exit 1
            fi
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag must match tauri.conf.json version
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$EXPECTED_TAG"
          # A dispatch-built release has no tag object to lean on — the name
          # is whatever was typed — so demand plain v-semver there (RT2 F5).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::dispatch tag_name '$TAG' is not vMAJOR.MINOR.PATCH — refusing to publish"
              exit 1
            fi
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "::error::tag $TAG does not start with v"; exit 1 ;;
          esac
          CONF_VERSION="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' gui/src-tauri/tauri.conf.json | head -1)"
          if [ "$VERSION" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG vs tauri.conf.json version $CONF_VERSION — bump the version surfaces and retag"
            exit 1
          fi
          echo "tag $TAG matches version $CONF_VERSION"
      # RT2 F1: PUBLIC_KEY_HEX_DEFAULT starts life as a placeholder that
      # release prep swaps BY HAND for the operator's ed25519 key (the value
      # never travels through chat — see the settings.rs doc comment). A
      # forgotten swap bricks every volunteer's Start with an error message
      # that solicits pasting a key (a ready-made phishing template). This
      # grep passes only when the constant holds a 64-hex key, exactly once.
      - name: Pinned contract key must be swapped out of the placeholder
        run: |
          set -euo pipefail
          FILE="gui/src-tauri/src/settings.rs"
          COUNT="$(grep -cE '^pub const PUBLIC_KEY_HEX_DEFAULT: &str = "[0-9a-fA-F]{64}";$' "$FILE" || true)"
          if [ "$COUNT" != "1" ]; then
            echo "::error::PUBLIC_KEY_HEX_DEFAULT is not a 64-hex key (matches: $COUNT) — swap the placeholder for the operator's key before releasing (see settings.rs)"
            exit 1
          fi
          echo "pinned contract key is 64-hex — placeholder swapped"

  build:
    needs: version-guard
    # Proceed only when the guard passed. The guard is unconditional now
    # (RT2 F5), so 'skipped' is no longer a dispatch escape hatch; this
    # never proceeds when it failed or the run was cancelled.
    if: ${{ !cancelled() && needs.version-guard.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            bundles: deb,appimage
            tauri_extra: ""
            rust_targets: ""
            # only the installers — the appimage build tree also contains
            # extracted .so/.desktop/copyright files that must NOT become
            # release assets (279-asset incident, v0.1.0 shakeout)
            artifact_globs: |
              gui/src-tauri/target/release/bundle/**/*.deb
              gui/src-tauri/target/release/bundle/**/*.AppImage
          - name: windows
            os: windows-latest
            bundles: nsis
            tauri_extra: ""
            rust_targets: ""
            artifact_globs: |
              gui/src-tauri/target/release/bundle/**/*.exe
          # arm64 + x86_64 in one universal binary (arm64 runner cross-
          # builds the x86_64 slice; the dmg carries the universal .app).
          - name: macos-universal
            os: macos-15
            bundles: dmg
            tauri_extra: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # with an explicit --target, tauri puts bundles under target/<triple>/release/bundle
            bundle_dir: universal-apple-darwin/release
            artifact_globs: |
              gui/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (SHA-pinned; dependabot keeps the pin fresh)
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Linux system deps (webkit2gtk / tray / bundler tools)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: npm ci
        working-directory: gui
        run: npm ci

      # RT2 F5: verify BEFORE stamping — a checkout whose package.json /
      # Cargo.toml drifted from tauri.conf.json must fail the build instead
      # of being silently fixed in-flight (the old order stamped first, so
      # verify-version only ever checked that the stamp worked).
      - name: Verify version surfaces are consistent (fail on drift)
        working-directory: gui
        run: npm run verify-version

      - name: Stamp the release version (tauri.conf.json is the source of truth)
        working-directory: gui
        run: |
          npm run sync-version
          npm run verify-version

      - name: Build bundles
        working-directory: gui
        run: npx tauri build ${{ matrix.tauri_extra }} --bundles ${{ matrix.bundles }}

      # The bundler names bundle artifacts after the DISPLAY productName
      # (spaces included) and Tauri 2 has no separate installer-name config
      # (upstream tauri#13999); a GitHub Release upload would then mangle
      # every space to a dot ("Civil.Awareness.Warrior_…"). Rename the
      # display-name prefix to the kebab name so every release asset is
      # civil-awareness-warrior_*. (The executables inside installers keep
      # their civil-awareness-warrior name via bundle.mainBinaryName; the
      # display name inside the .app / Start-menu entry is unaffected.)
      - name: Normalize bundle artifact names (display name → kebab)
        if: runner.os != 'Windows'
        working-directory: gui/src-tauri/target/${{ matrix.bundle_dir || 'release' }}/bundle
        shell: bash
        run: |
          shopt -s nullglob
          for f in */*; do
            # Files only (deb/AppImage/dmg/rpm): bundle/macos/*.app is a
            # DIRECTORY that must keep its display name — the dmg embeds it.
            [ -f "$f" ] || continue
            d=$(dirname "$f"); b=$(basename "$f")
            case "$b" in
              "Civil Awareness Warrior"*)
                mv "$f" "$d/civil-awareness-warrior${b#Civil Awareness Warrior}" ;;
            esac
          done

      - name: Normalize bundle artifact names (Windows)
        if: runner.os == 'Windows'
        working-directory: gui/src-tauri/target/release/bundle
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter 'Civil Awareness Warrior*' | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName $_.Name.Replace('Civil Awareness Warrior', 'civil-awareness-warrior')
          }

      # Windows bonus artifact: the bare exe in a zip, for volunteers who
      # want no installer. Needs the WebView2 runtime the OS already ships
      # on Windows 10+ (the NSIS installer carries a bootstrapper for
      # machines that somehow lack it). Fixed filename on purpose: a git
      # tag name can contain shell metacharacters, so ${{ github.ref_name
      # }} is deliberately NOT interpolated into the pwsh line.
      - name: Portable zip (Windows)
        if: matrix.name == 'windows'
        working-directory: gui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path src-tauri/target/release/civil-awareness-warrior.exe `
            -DestinationPath dist/civil-awareness-warrior-portable.zip

      - name: Upload bundles for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ matrix.artifact_globs }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable zip
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}-portable
          path: gui/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect every platform bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        # flatten the per-artifact subdirs (asset names are flat on the
        # release), then hash everything except SHA256SUMS itself — a
        # self-entry can never verify (fixed live on the v0.1.0 asset)
        run: |
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          # stage through a temp file: writing the output while find still
          # traverses the directory is the SC2094 read/write-same-file race
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.part
          mv SHA256SUMS.part SHA256SUMS

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4 (node 24)
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Civil Awareness Warrior ${{ inputs.tag_name || github.ref_name }}
          files: dist/**
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
